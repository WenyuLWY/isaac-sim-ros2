services:
  hub-cache:
    image: nvcr.io/nvidia/omniverse/hub_workstation_cache:2.2.0
    network_mode: "host"
    user: "1234:1234"
    volumes:
     - ~/.cache/ov/hub:/var/cache/hub:rw
    restart: unless-stopped

  isaac-sim:
    image: nvcr.io/nvidia/isaac-sim:6.2.0
    network_mode: "host"
    ipc: host
    gpus: all
    user: "1234:1234"
    healthcheck:
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
      test: ["CMD-SHELL", "logdir=/isaac-sim/.nvidia-omniverse/logs/Kit; [ -d \"$$logdir\" ] && latest=$$(ls -t \"$$logdir\"/*/*/kit_*.log 2>/dev/null | head -1) && [ -n \"$$latest\" ] && grep -q AppReady \"$$latest\" && exit 0; exit 1"]
    depends_on:
      hub-cache:
        condition: service_started
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - ACCEPT_EULA=Y
      - ISAACSIM_HOST=127.0.0.1
      - ISAACSIM_SIGNAL_PORT=49100
      - ISAACSIM_STREAM_PORT=47998
      # - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      # - FASTRTPS_DEFAULT_PROFILES_FILE=/isaac-sim/fastdds.xml
      # - ROS_DOMAIN_ID=0
    volumes:
      - ${PWD}/../tmp/isaac/cache/main:/isaac-sim/.cache:rw
      - ${PWD}/../tmp/isaac/cache/computecache:/isaac-sim/.nv/ComputeCache:rw
      - ${PWD}/../tmp/isaac/cache/kit:/isaac-sim/kit/cache:rw
      - ${PWD}/../tmp/isaac/logs:/isaac-sim/.nvidia-omniverse/logs:rw
      - ${PWD}/../tmp/isaac/config:/isaac-sim/.nvidia-omniverse/config:rw
      - ${PWD}/../tmp/isaac/data:/isaac-sim/.local/share/ov/data:rw
      - ${PWD}/../tmp/isaac/pkg:/isaac-sim/.local/share/ov/pkg:rw
      - ~/.cache/ov/hub:/var/cache/hub:rw
      - ${PWD}/my_test:/isaac-sim/my_test:rw
      # - ${PWD}/fastdds.xml:/isaac-sim/fastdds.xml:ro
    # command: >
    #   bash -c "
    #   set -e &&
    #   /isaac-sim/python.sh /isaac-sim/my_test/test.py
    #   "
    # entrypoint: ["bash", "-c", "set -e && /isaac-sim/python.sh /isaac-sim/my_test/test.py"]
    # entrypoint: ["/bin/bash", "-c"]
    # command: ["/isaac-sim/python.sh /isaac-sim/my_test/test.py"]
    # command: ["/isaac-sim/license.sh && /isaac-sim/privacy.sh && exec /isaac-sim/python.sh /isaac-sim/my_test/test.py"]
    entrypoint: ["/isaac-sim/python.sh"]
    command: ["/isaac-sim/my_test/test.py"]
    restart: unless-stopped

  web-viewer:
    build:
      dockerfile: Dockerfile.webviewer
      network: host
      args:
        ISAACSIM_HOST: 127.0.0.1
        ISAACSIM_SIGNAL_PORT: 49100
        ISAACSIM_STREAM_PORT: 47998
    network_mode: "host"
    command: ["npx", "vite", "preview", "--host", "--port", "8210"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8210/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      isaac-sim:
        condition: service_healthy
    restart: unless-stopped

