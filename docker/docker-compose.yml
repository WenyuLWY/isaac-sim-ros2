  ros2-jazzy:
    build:
      dockerfile: Dockerfile.jazzy
    gpus: all
    user: "1234:1234"
    # command: bash
    # tty: true
    # stdin_open: true
    # command: ["bash","-c","/root/start.sh"]
    volumes:
      - ${PWD}/../tmp/ros2/build:/home/user/ros2_ws/build
      - ${PWD}/../tmp/ros2/install:/home/user/ros2_ws/install
      - ${PWD}/../tmp/ros2/log:/home/user/ros2_ws/log
      - ${PWD}/../src:/home/user/ros2_ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${PWD}/.docker.container.xauth:/home/user/.docker.container.xauth
      - /dev:/dev 
      - /etc/localtime:/etc/localtime:ro
      # - ${PWD}/fastdds.xml:/root/.ros/fastdds.xml:ro
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/home/user/.docker.container.xauth
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GL_SYNC_TO_VBLANK=0
      # - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      # - FASTRTPS_DEFAULT_PROFILES_FILE=/root/.ros/fastdds.xml
      # - ROS_DOMAIN_ID=0
      # - TERM=xterm-256color
    network_mode: "host"
    ipc: host
    depends_on:
      isaac-sim:
        condition: service_healthy
    restart: no
