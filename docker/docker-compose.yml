services:

  hub-cache:
    image: nvcr.io/nvidia/omniverse/hub_workstation_cache:2.2.0
    network_mode: "host"
    user: "1234:1234"
    volumes:
     - ${ISAACSIM_HUB_CACHE_PATH:-~/.cache/ov/hub}:/var/cache/hub:rw
    restart: unless-stopped

  isaac-sim:
    image: ${ISAAC_SIM_IMAGE:-isaac-sim-docker:latest}
    network_mode: "host"
    gpus: all
    user: "1234:1234"
    healthcheck:
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
      test: ["CMD-SHELL", "logdir=/isaac-sim/.nvidia-omniverse/logs/Kit; [ -d \"$$logdir\" ] && latest=$$(ls -t \"$$logdir\"/*/*/kit_*.log 2>/dev/null | head -1) && [ -n \"$$latest\" ] && grep -q AppReady \"$$latest\" && exit 0; exit 1"]
    depends_on:
      hub-cache:
        condition: service_started
    environment:
      - NVIDIA_VISIBLE_DEVICES=${GPU_DEVICE:-all}
      - ACCEPT_EULA=Y
      - ISAACSIM_HOST=${ISAACSIM_HOST:-127.0.0.1}
      - ISAACSIM_SIGNAL_PORT=${ISAACSIM_SIGNAL_PORT:-49100}
      - ISAACSIM_STREAM_PORT=${ISAACSIM_STREAM_PORT:-47998}
    volumes:
      - ${ISAAC_SIM_DATA:-~/docker/isaac-sim}/cache/main:/isaac-sim/.cache:rw
      - ${ISAAC_SIM_DATA:-~/docker/isaac-sim}/cache/computecache:/isaac-sim/.nv/ComputeCache:rw
      - ${ISAAC_SIM_DATA:-~/docker/isaac-sim}/cache/kit:/isaac-sim/kit/cache:rw
      - ${ISAAC_SIM_DATA:-~/docker/isaac-sim}/logs:/isaac-sim/.nvidia-omniverse/logs:rw
      - ${ISAAC_SIM_DATA:-~/docker/isaac-sim}/config:/isaac-sim/.nvidia-omniverse/config:rw
      - ${ISAAC_SIM_DATA:-~/docker/isaac-sim}/data:/isaac-sim/.local/share/ov/data:rw
      - ${ISAAC_SIM_DATA:-~/docker/isaac-sim}/pkg:/isaac-sim/.local/share/ov/pkg:rw
      - ${ISAACSIM_HUB_CACHE_PATH:-~/.cache/ov/hub}:/var/cache/hub:rw
    restart: unless-stopped

  web-viewer:
    build:
      context: ./web-viewer
      network: host
      args:
        ISAACSIM_HOST: ${ISAACSIM_HOST:-127.0.0.1}
        ISAACSIM_SIGNAL_PORT: ${ISAACSIM_SIGNAL_PORT:-49100}
        ISAACSIM_STREAM_PORT: ${ISAACSIM_STREAM_PORT:-47998}
    network_mode: "host"
    command: ["npx", "vite", "preview", "--host", "--port", "${WEB_VIEWER_PORT:-8210}"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${WEB_VIEWER_PORT:-8210}/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      isaac-sim:
        condition: service_healthy
    restart: unless-stopped


  ros2-humble:
    build: .
    gpus: all
    command: bash
    tty: true
    stdin_open: true
    # command: ["bash","-c","/root/start.sh"]
    volumes:
      - ${PKG_ROOT_DIR:-../}/src:/root/ros2_ws/src
      - ${PKG_ROOT_DIR:-../}/tmp/ros2/build:/root/ros2_ws/build
      - ${PKG_ROOT_DIR:-../}/tmp/ros2/install:/root/ros2_ws/install
      - ${PKG_ROOT_DIR:-../}/tmp/ros2/log:/root/ros2_ws/log
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTH_PATH:-/.docker.container.xauth}:/root/.docker.container.xauth
      - /dev:/dev 
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/root/.docker.container.xauth
      # - TERM=xterm-256color
    network_mode: "host"
    depends_on:
      isaac-sim:
        condition: service_started
    restart: unless-stopped


